# Overseer's Maul "Honor"

- type: entity
  parent: BaseMeleeWeaponEnergy
  id: WeaponOverseerMace
  name: heavy maul "Honor"
  description: A large, weighty maul, designed to deal the pain, alongside disabling targets. But when activated, becomes an energy axe made of searing plasma, cleaving through anything in its way.
  components:
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Melee/honormace.rsi
    layers:
    - state: e_sword
    - state: e_sword_blade
      visible: false
      shader: unshaded
      map: [ "blade" ]
  - type: ItemToggle
    soundActivate:
      path: /Audio/_Goobstation/Weapons/EswordWelder/on.ogg
    soundDeactivate:
      path: /Audio/_Goobstation/Weapons/EswordWelder/off.ogg
  - type: ItemToggleActiveSound
    activeSound:
      path: /Audio/_Goobstation/Weapons/EswordWelder/hum.ogg
  - type: PointLight
    enabled: false
    radius: 2
    energy: 2
    color: red
  - type: Item
    sprite: _Mono/Objects/Weapons/Melee/honormace.rsi
    size: Normal
  - type: Clothing
    sprite: _Mono/Objects/Weapons/Melee/honormace.rsi
    slots:
    - Back
    - Belt
    - SuitStorage
  - type: ComponentToggler
    components:
    - type: Sharp
    - type: Execution
      doAfterDuration: 4.0
  - type: ItemToggleSize
    activatedSize: Large
  - type: MeleeWeapon
    heavyStaminaCost: 20
    wideAnimationRotation: -135
    attackRate: 1
    damage: #depowered is as good as fireaxe in flat damages but blunt causes much less bleeding
      types:
        Blunt: 20
        Piercing: 5
        Structural: 18
    soundHit:
      collection: MetalThud
  - type: DisarmMalus
    malus: 0.6
  - type: EnergySword
    colorOptions:
    - "#FFFFFF85"
    activatedColor: "#FFFFFF85"
  - type: ItemToggleMeleeWeapon
    activatedSoundOnHit:
      path: /Audio/_Goobstation/Weapons/EswordWelder/eblade1.ogg
      params:
        variation: 0.250
    activatedSoundOnHitNoDamage:
      path: /Audio/_Goobstation/Weapons/EswordWelder/eblade1.ogg
      params:
        variation: 0.250
        volume: -10
    activatedSoundOnSwing:
      path: /Audio/_Goobstation/Weapons/EswordWelder/swing.ogg
      params:
        variation: 0.125
    activatedDamage: #stronger than fireaxe in flat damage but the heat prevents bleeding entirely
      types:
        Slash: 16
        Heat: 16
        Structural: 30
  - type: Reflect
    reflectProb: 0
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: ItemToggleRequiresCharge
    requiredCharge: 125
  - type: ItemToggleExaminableStatus
  - type: MeleeBatteryHitsLeft
  - type: StaminaDamageOnHitRequiresCharge #Shh you dont see shitcoding
    requiredCharge: 125
  - type: StaminaDamageOnHitRequiresToggle
  - type: StaminaDamageOnHit
    damage: 0.0000001
